name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs the reduced configuration: shorter horizons, fewer
  # scenarios, smaller iteration caps. It changes SCALE only -- never a
  # formulation -- so the mathematical claims are still exercised.
  PSOPT_FAST: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # Lint only. The tutorial sources use deliberate manual layout that a
      # formatter would reflow into something harder to read beside the
      # equations they mirror.
      - run: uv run ruff check .

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Install IPOPT
        # IPOPT is a system binary, not a wheel, and roughly half the course
        # needs it. coinor-libipopt is the packaged build on Ubuntu.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coinor-libipopt-dev coinor-libipopt1v5 || true
          which ipopt || echo "ipopt not on PATH; solver-dependent tests will skip"

      - name: Report what this runner can actually solve
        run: uv run python scripts/check_solvers.py

      - run: uv run pytest -q

  notebooks:
    name: execute notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Split so a failure points at a specific group and the wall clock
        # stays reasonable.
        group:
          - "01_ 02_ 03_"
          - "04_ 05_ 06_"
          - "07_ 08_ 09_ 10_"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Install IPOPT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coinor-libipopt-dev coinor-libipopt1v5 || true

      - name: Build and execute the solution notebooks
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, 'scripts')
          from build_exercise_notebooks import build
          raise SystemExit(build(only=tuple('${{ matrix.group }}'.split()), execute=True))
          "

      - name: Upload the executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-${{ strategy.job-index }}
          path: tutorials/*.ipynb
          retention-days: 7

  stale-notebooks:
    name: notebooks match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked

      # Committed notebooks are GENERATED. If a source changed and the
      # notebooks were not rebuilt, a student would work from a stale exercise
      # while the instructor reads a different solution.
      - name: Check for stale generated notebooks
        run: |
          uv run python -c "
          import sys; sys.path.insert(0, 'scripts')
          from build_exercise_notebooks import check
          stale = check()
          for item in stale:
              print('STALE:', item)
          raise SystemExit(1 if stale else 0)
          "

  fresh-install:
    name: fresh install from scratch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Resolve and install with no cache at all
        run: uv sync --locked --no-cache
      - name: The commands the README promises
        run: |
          uv run python scripts/check_solvers.py
          uv run python -c "
          from psopt_course.networks import two_generator_system, three_bus_system
          from psopt_course.solvers import available_solvers
          print(two_generator_system().generator_table())
          print(three_bus_system().branch_table())
          print(available_solvers())
          "
